name: Job Dependency Flow

on:
  push:
    branches:
      - main


jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Job 1
        run: python Job1.py

  job2:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Job 2
        run: python Job2.py

  job3:
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Job 3
        run: python Job3.py

  job4:
    runs-on: ubuntu-latest
    needs: job2
    steps:
      - name: Job 4
        run: python Job4.py

  job5:
    runs-on: ubuntu-latest
    needs: job3
    steps:
      - name: Job 5
        run: python Job5.py

  job6:
    runs-on: ubuntu-latest
    needs: [job4, job5]
    steps:
      - name: Job 6
        run: python Job6.py